name: MathForge verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates curl python3-venv bubblewrap libgl1 util-linux python3-openvdb=10.0.1-2.3+b1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: bash deployment/setup.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm audit --omit=dev
      - run: npm run benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports
          path: reports/
